<!DOCTYPE html>
<html lang="en">
	<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Tiểu Tiên Lộ (demo)</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6400540,"index.wasm":39514754},"focusCanvas":true,"godotVersion":"4.2.2","serviceWorker":{"scope":"./","code":"service-worker.js"},"shader_compiler":true,"universe":false};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

// iPhone keyboard fix for Godot web builds
(function () {
	const canvas = document.getElementById('canvas');
	if (!canvas) return;
	canvas.setAttribute('tabindex', '0');

	const helper = document.createElement('input');
	helper.type = 'text';
	helper.autocomplete = 'off';
	helper.autocorrect = 'off';
	helper.autocapitalize = 'none';
	helper.spellcheck = false;
	helper.inputMode = 'text';
	helper.placeholder = 'Tên';
	helper.setAttribute('aria-label', 'keyboard helper');
	Object.assign(helper.style, {
		position: 'fixed',
		left: '50%',
		bottom: '12px',
		transform: 'translateX(-50%)',
		width: '220px',
		maxWidth: 'calc(100vw - 36px)',
		height: '36px',
		padding: '0 12px',
		fontSize: '16px',
		borderRadius: '10px',
		border: '1px solid rgba(255,255,255,0.2)',
		background: 'rgba(255,255,255,0.12)',
		color: '#fff',
		zIndex: '2147483647',
		opacity: '0.02',
		pointerEvents: 'auto',
		outline: 'none'
	});
	document.body.appendChild(helper);

	let refocusTimer = null;
	function focusKeyboard() {
		if (document.visibilityState !== 'visible') return;
		try {
			helper.focus();
			helper.setSelectionRange(helper.value.length, helper.value.length);
		} catch (e) {}
	}

	function requestRefocus() {
		if (refocusTimer) clearTimeout(refocusTimer);
		refocusTimer = setTimeout(function () {
			focusKeyboard();
		}, 180);
	}

	canvas.addEventListener('touchstart', function (e) {
		if (e.target === helper) return;
		requestRefocus();
	}, { passive: false });
	canvas.addEventListener('touchend', function (e) {
		if (e.target === helper) return;
		requestRefocus();
	}, { passive: false });
	canvas.addEventListener('click', function () {
		requestRefocus();
	}, { passive: true });
	canvas.addEventListener('pointerdown', function () {
		requestRefocus();
	}, { passive: true });
	document.addEventListener('touchstart', function (e) {
		if (e.target === helper) return;
		if (e.target === canvas || canvas.contains(e.target)) {
			requestRefocus();
		}
	}, { passive: false });
	helper.addEventListener('blur', function () {
		requestRefocus();
	});

	setInterval(function () {
		if (document.activeElement !== helper && document.visibilityState === 'visible') {
			requestRefocus();
		}
	}, 1500);
})();
		</script>
	</body>
</html>
